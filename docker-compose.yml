version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sih26091
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend-api:
    build: ./backend-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-to-container hostnames - backend-api's own code defaults these
      # to localhost, which doesn't resolve between separate containers on the
      # compose network, so these overrides are required, not just documentation.
      FEASIBILITY_URL: http://feasibility:8001
      CALCULATOR_URL: http://calculator:8002
      ESS_SCORING_URL: http://ess-scoring:8003
      ADVISORY_LLM_URL: http://advisory-llm:8004
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - feasibility
      - calculator
      - ess-scoring
      - advisory-llm
    volumes:
      - ./backend-api:/app

  feasibility:
    build:
      context: .
      dockerfile: services/feasibility/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./services/feasibility:/app/services/feasibility
      - ./data:/app/data

  calculator:
    build: ./services/calculator
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8002:8002"
    volumes:
      - ./services/calculator:/app

  ess-scoring:
    build: ./services/ess-scoring
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8003:8003"
    volumes:
      - ./services/ess-scoring:/app

  advisory-llm:
    build: ./services/advisory-llm
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8004:8004"
    volumes:
      - ./services/advisory-llm:/app

  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines this at build time, so it must be a build arg, not a runtime
        # environment var. False here so the container talks to real backend-api,
        # not mock data.
        VITE_USE_MOCKS: "false"
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend-api

volumes:
  postgres_data:
